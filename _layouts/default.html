<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; line-height: 1.65; }
    header { border-bottom: 1px solid #ddd; padding: 1rem 1.25rem; }
    header a { color: inherit; text-decoration: none; font-size: 1.35rem; font-weight: 600; }
    main { max-width: 900px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    h1 { line-height: 1.15; font-size: clamp(2rem, 6vw, 3.2rem); }
    h2 { margin-top: 2.4rem; }
    h3 { margin-top: 1.8rem; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    pre { overflow-x: auto; padding: 1rem; border-radius: 8px; }
    .MathJax { overflow-x: auto; overflow-y: hidden; }
    mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding: .4rem 0; }
    table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
    th, td { border: 1px solid #bbb; padding: .5rem .7rem; text-align: left; }
    blockquote { margin-left: 0; padding-left: 1rem; border-left: 4px solid #999; }
    a { color: #0969da; }
    @media (prefers-color-scheme: dark) { a { color: #58a6ff; } header { border-color: #444; } th, td { border-color: #555; } }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'
      },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <header><a href="{{ '/' | relative_url }}">{{ site.title }}</a></header>
  <main>{{ content }}</main>
</body>
</html>
